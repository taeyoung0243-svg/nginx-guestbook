# /etc/nginx/sites-available/guestbook
# 활성화: sudo ln -s /etc/nginx/sites-available/guestbook /etc/nginx/sites-enabled/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 1) 정적 파일: Nginx가 직접 응답
    root /var/www/guestbook;
    index index.html;

    access_log /var/log/nginx/guestbook.access.log;
    error_log  /var/log/nginx/guestbook.error.log;

    # 서버 버전 숨기기 (보안)
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # 2) /api/ 요청: 리버스 프록시로 FastAPI(127.0.0.1:8000)에 전달
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 요청 본문 크기 제한
    client_max_body_size 16k;
}
